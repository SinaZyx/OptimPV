<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: Arial, sans-serif; font-size: 12px; fill: #34495e; }
      .label { font-family: Arial, sans-serif; font-size: 11px; fill: #2c3e50; }
      .axis-label { font-family: Arial, sans-serif; font-size: 10px; fill: #7f8c8d; }
      .value-label { font-family: Arial, sans-serif; font-size: 10px; font-weight: bold; }
      .positive { fill: #27ae60; }
      .negative { fill: #e74c3c; }
      .baseline { stroke: #2c3e50; stroke-width: 2; }
    </style>
  </defs>
  
  <!-- Titre -->
  <text x="400" y="25" text-anchor="middle" class="title">FIGURE 9.1 : Analyse de sensibilité - Tornado Diagram</text>
  <text x="400" y="45" text-anchor="middle" class="subtitle">Impact des variables critiques sur le TRI du projet Antibes</text>
  
  <!-- Axe horizontal -->
  <line x1="100" y1="400" x2="700" y2="400" stroke="#bdc3c7" stroke-width="1"/>
  
  <!-- Graduation axe horizontal -->
  <text x="200" y="415" text-anchor="middle" class="axis-label">12%</text>
  <text x="300" y="415" text-anchor="middle" class="axis-label">13%</text>
  <text x="400" y="415" text-anchor="middle" class="axis-label">14%</text>
  <text x="500" y="415" text-anchor="middle" class="axis-label">15%</text>
  <text x="600" y="415" text-anchor="middle" class="axis-label">16%</text>
  
  <!-- Ligne de base TRI 13,6% -->
  <line x1="436" y1="100" x2="436" y2="400" class="baseline" stroke-dasharray="5,5"/>
  <text x="446" y="120" class="label" style="font-weight: bold;">TRI Base: 13,6%</text>
  
  <!-- Variable 1: Prix électricité (±1,5%) -->
  <!-- Barre négative: 12,1% (position 242) -->
  <rect x="242" y="150" width="194" height="30" class="negative"/>
  <!-- Barre positive: 15,1% (position 436 à 564) -->
  <rect x="436" y="150" width="128" height="30" class="positive"/>
  
  <!-- Labels Variable 1 -->
  <text x="90" y="170" class="label" font-weight="bold">Prix électricité</text>
  <text x="90" y="185" class="label">±1 c€/kWh</text>
  <text x="144" y="170" class="value-label negative">12,1%</text>
  <text x="570" y="170" class="value-label positive">15,1%</text>
  
  <!-- Variable 2: Production PV (±0,8%) -->
  <!-- Barre négative: 12,8% (position 312) -->
  <rect x="312" y="220" width="124" height="30" class="negative"/>
  <!-- Barre positive: 14,4% (position 436 à 516) -->
  <rect x="436" y="220" width="80" height="30" class="positive"/>
  
  <!-- Labels Variable 2 -->
  <text x="90" y="240" class="label" font-weight="bold">Production PV</text>
  <text x="90" y="255" class="label">±10%</text>
  <text x="264" y="240" class="value-label negative">12,8%</text>
  <text x="520" y="240" class="value-label positive">14,4%</text>
  
  <!-- Variable 3: Coûts maintenance (±0,5%) -->
  <!-- Barre négative: 13,1% (position 386) -->
  <rect x="386" y="290" width="50" height="30" class="negative"/>
  <!-- Barre positive: 14,1% (position 436 à 486) -->
  <rect x="436" y="290" width="50" height="30" class="positive"/>
  
  <!-- Labels Variable 3 -->
  <text x="90" y="310" class="label" font-weight="bold">Coûts maintenance</text>
  <text x="90" y="325" class="label">±50%</text>
  <text x="336" y="310" class="value-label negative">13,1%</text>
  <text x="490" y="310" class="value-label positive">14,1%</text>
  
  <!-- Légende -->
  <rect x="150" y="440" width="20" height="15" class="negative"/>
  <text x="175" y="452" class="label">Scénario pessimiste</text>
  
  <rect x="350" y="440" width="20" height="15" class="positive"/>
  <text x="375" y="452" class="label">Scénario optimiste</text>
  
  <!-- Note -->
  <text x="400" y="480" text-anchor="middle" class="axis-label">TRI seuil minimum: 8,0% | Tous les scénarios restent rentables</text>
  
</svg>