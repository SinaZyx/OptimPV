<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Définitions des styles (même thème que figure 4.1) -->
  <defs>
    <style>
      .title-text { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; fill: #1a1a1a; }
      .box-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; fill: #333; }
      .level-text { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; fill: white; }
      .number-text { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; text-anchor: middle; fill: white; }
      .percent-text { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; fill: white; }
      .detail-text { font-family: Arial, sans-serif; font-size: 11px; text-anchor: middle; fill: #555; }
      .small-text { font-family: Arial, sans-serif; font-size: 10px; text-anchor: start; fill: #555; }
      .flow-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; text-anchor: middle; fill: #333; }
    </style>
    
    <!-- Flèches -->
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#333" />
    </marker>
  </defs>

  <!-- Fond blanc -->
  <rect width="100%" height="100%" fill="white"/>
  
  <!-- Titre principal (même style que figure 4.1) -->
  <rect x="100" y="20" width="600" height="45" fill="#f5f5f5" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="400" y="48" class="title-text">Pyramide de Conversion - Prospection ACC</text>

  <!-- NIVEAU 1: Prospects identifiés -->
  <g transform="translate(400, 120)">
    <!-- Trapèze niveau 1 -->
    <path d="M -200,0 L 200,0 L 180,60 L -180,60 Z" fill="#1976d2" stroke="#1565c0" stroke-width="2"/>
    <text x="0" y="20" class="number-text">100</text>
    <text x="0" y="38" class="level-text">Prospects identifiés</text>
    <text x="0" y="52" class="percent-text">(Base 100%)</text>
  </g>

  <!-- Flèche 1→2 -->
  <line x1="400" y1="185" x2="400" y2="215" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="225" class="flow-text">Qualification</text>

  <!-- NIVEAU 2: Prospects qualifiés -->
  <g transform="translate(400, 230)">
    <!-- Trapèze niveau 2 -->
    <path d="M -180,0 L 180,0 L 150,60 L -150,60 Z" fill="#388e3c" stroke="#2e7d32" stroke-width="2"/>
    <text x="0" y="20" class="number-text">20</text>
    <text x="0" y="38" class="level-text">Projets qualifiés</text>
    <text x="0" y="52" class="percent-text">(20% conversion)</text>
  </g>

  <!-- Flèche 2→3 -->
  <line x1="400" y1="295" x2="400" y2="325" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="335" class="flow-text">Validation technique</text>

  <!-- NIVEAU 3: Projets validés -->
  <g transform="translate(400, 340)">
    <!-- Trapèze niveau 3 -->
    <path d="M -150,0 L 150,0 L 110,60 L -110,60 Z" fill="#f57c00" stroke="#ef6c00" stroke-width="2"/>
    <text x="0" y="20" class="number-text">5</text>
    <text x="0" y="38" class="level-text">Projets validés</text>
    <text x="0" y="52" class="percent-text">(5% du total)</text>
  </g>

  <!-- Flèche 3→4 -->
  <line x1="400" y1="405" x2="400" y2="435" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="445" class="flow-text">Signature + Financement</text>

  <!-- NIVEAU 4: Projets réalisés -->
  <g transform="translate(400, 450)">
    <!-- Trapèze niveau 4 (plus petit) -->
    <path d="M -110,0 L 110,0 L 70,60 L -70,60 Z" fill="#d32f2f" stroke="#c62828" stroke-width="2"/>
    <text x="0" y="20" class="number-text">1-2</text>
    <text x="0" y="38" class="level-text">Projets réalisés</text>
    <text x="0" y="52" class="percent-text">(1-2% final)</text>
  </g>

  <!-- Légendes latérales avec détails -->
  <g transform="translate(50, 140)">
    <text x="0" y="0" class="small-text" font-weight="bold">Étape 1: Identification</text>
    <text x="0" y="18" class="small-text">• Scoring automatique</text>
    <text x="0" y="34" class="small-text">• Analyse cadastrale</text>
    <text x="0" y="50" class="small-text">• Potentiel &gt; 100 kWc</text>
  </g>

  <g transform="translate(50, 250)">
    <text x="0" y="0" class="small-text" font-weight="bold">Étape 2: Qualification</text>
    <text x="0" y="18" class="small-text">• Contact commercial</text>
    <text x="0" y="34" class="small-text">• Intérêt confirmé</text>
    <text x="0" y="50" class="small-text">• Visite site</text>
  </g>

  <g transform="translate(50, 360)">
    <text x="0" y="0" class="small-text" font-weight="bold">Étape 3: Validation</text>
    <text x="0" y="18" class="small-text">• Étude détaillée</text>
    <text x="0" y="34" class="small-text">• Accord principe</text>
    <text x="0" y="50" class="small-text">• 50 signatures</text>
  </g>

  <g transform="translate(50, 470)">
    <text x="0" y="0" class="small-text" font-weight="bold">Étape 4: Réalisation</text>
    <text x="0" y="18" class="small-text">• Enedis validé</text>
    <text x="0" y="34" class="small-text">• Financement OK</text>
    <text x="0" y="50" class="small-text">• Installation</text>
  </g>

  <!-- Points de blocage (côté droit) - CORRIGÉS -->
  <g transform="translate(570, 200)">
    <rect x="0" y="-15" width="150" height="30" fill="#ffebee" stroke="#d32f2f" stroke-width="1" rx="3"/>
    <text x="75" y="5" class="detail-text" fill="#c62828" font-weight="bold">-80% : Pas d'intérêt</text>
  </g>

  <g transform="translate(570, 310)">
    <rect x="0" y="-15" width="150" height="30" fill="#ffebee" stroke="#d32f2f" stroke-width="1" rx="3"/>
    <text x="75" y="5" class="detail-text" fill="#c62828" font-weight="bold">-75% : Complexité</text>
  </g>

  <g transform="translate(570, 420)">
    <rect x="0" y="-15" width="150" height="30" fill="#ffebee" stroke="#d32f2f" stroke-width="1" rx="3"/>
    <text x="75" y="5" class="detail-text" fill="#c62828" font-weight="bold">-60% : Signatures</text>
  </g>

  <!-- Indicateur ROI en bas - CORRIGÉ -->
  <g transform="translate(400, 540)">
    <rect x="-200" y="-15" width="400" height="30" fill="#e1f5fe" stroke="#0277bd" stroke-width="2" rx="5"/>
    <text x="0" y="5" class="box-text" fill="#0277bd">
      ROI: 1 projet ACC = 500-800k€ CA sur durée projet
    </text>
  </g>

</svg>