<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Définitions des styles -->
  <defs>
    <style>
      .layer-title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .module-text { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
      .legend-text { font-family: Arial, sans-serif; font-size: 12px; }
      .legend-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; }
    </style>
    <!-- Marqueurs pour les flèches -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d32f2f" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#388e3c" />
    </marker>
  </defs>

  <!-- Titre principal -->
  <text x="400" y="30" class="layer-title" fill="#333">Architecture Modulaire en 3 Couches</text>

  <!-- COUCHE 1: INTERFACE UTILISATEUR -->
  <rect x="50" y="60" width="600" height="120" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="350" y="85" class="layer-title" fill="#1976d2">1. Couche Interface Utilisateur</text>
  
  <!-- Modules UI -->
  <rect x="80" y="100" width="200" height="60" fill="#bbdefb" stroke="#1565c0" stroke-width="1" rx="3"/>
  <text x="180" y="125" class="module-text" fill="#0d47a1">Interface Streamlit</text>
  <text x="180" y="145" class="module-text" fill="#0d47a1">Dashboard principal</text>

  <rect x="320" y="100" width="200" height="60" fill="#bbdefb" stroke="#1565c0" stroke-width="1" rx="3"/>
  <text x="420" y="125" class="module-text" fill="#0d47a1">Modules de</text>
  <text x="420" y="145" class="module-text" fill="#0d47a1">Visualisation</text>

  <!-- COUCHE 2: MÉTIER -->
  <rect x="50" y="220" width="600" height="180" fill="#e8f5e8" stroke="#388e3c" stroke-width="2" rx="5"/>
  <text x="350" y="245" class="layer-title" fill="#388e3c">2. Couche Métier (Business Logic)</text>

  <!-- Module Engine -->
  <rect x="80" y="265" width="150" height="80" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1" rx="3"/>
  <text x="155" y="290" class="module-text" fill="#1b5e20">engine_module</text>
  <text x="155" y="310" class="module-text" fill="#1b5e20">Calculs financiers</text>
  <text x="155" y="325" class="module-text" fill="#1b5e20">Simulations</text>

  <!-- Module Tax Engine (spécial) -->
  <rect x="260" y="265" width="150" height="80" fill="#ffcdd2" stroke="#d32f2f" stroke-width="2" rx="3"/>
  <text x="335" y="290" class="module-text" fill="#b71c1c">tax_engine</text>
  <text x="335" y="310" class="module-text" fill="#b71c1c">Fiscalité française</text>
  <text x="335" y="325" class="module-text" fill="#b71c1c">🔒 Isolé/Protégé</text>

  <!-- Business Modules -->
  <rect x="440" y="265" width="150" height="80" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1" rx="3"/>
  <text x="515" y="285" class="module-text" fill="#1b5e20">Business_modules</text>
  <text x="515" y="305" class="module-text" fill="#1b5e20">• CRM</text>
  <text x="515" y="320" class="module-text" fill="#1b5e20">• Facturation</text>
  <text x="515" y="335" class="module-text" fill="#1b5e20">• Gestion projets</text>

  <!-- COUCHE 3: DONNÉES -->
  <rect x="50" y="440" width="600" height="150" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
  <text x="350" y="465" class="layer-title" fill="#f57c00">3. Couche Données</text>

  <!-- APIs externes -->
  <rect x="80" y="485" width="140" height="80" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1" rx="3"/>
  <text x="150" y="505" class="module-text" fill="#e65100">APIs Externes</text>
  <text x="150" y="525" class="module-text" fill="#e65100">• Cadastre</text>
  <text x="150" y="540" class="module-text" fill="#e65100">• PVGIS</text>
  <text x="150" y="555" class="module-text" fill="#e65100">• DPE</text>

  <!-- Base de données -->
  <rect x="250" y="485" width="140" height="80" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1" rx="3"/>
  <text x="320" y="510" class="module-text" fill="#e65100">Base de données</text>
  <text x="320" y="530" class="module-text" fill="#e65100">Projets clients</text>
  <text x="320" y="550" class="module-text" fill="#e65100">Historiques</text>

  <!-- Configuration -->
  <rect x="420" y="485" width="140" height="80" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1" rx="3"/>
  <text x="490" y="510" class="module-text" fill="#e65100">Configuration</text>
  <text x="490" y="530" class="module-text" fill="#e65100">Système</text>
  <text x="490" y="550" class="module-text" fill="#e65100">Paramètres</text>

  <!-- FLÈCHES DE FLUX -->
  
  <!-- Flux principaux UI -> Métier -->
  <line x1="180" y1="180" x2="180" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="180" x2="420" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Flux retour Métier -> UI -->
  <line x1="200" y1="220" x2="200" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="220" x2="440" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Flux Métier -> Données -->
  <line x1="155" y1="345" x2="155" y2="440" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="335" y1="345" x2="320" y2="440" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="515" y1="345" x2="490" y2="440" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Flux retour Données -> Métier -->
  <line x1="175" y1="440" x2="175" y2="345" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="340" y1="440" x2="355" y2="345" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="510" y1="440" x2="535" y2="345" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Interface modulaire tax_engine (flèche spéciale) -->
  <line x1="260" y1="305" x2="230" y2="305" stroke="#d32f2f" stroke-width="3" marker-end="url(#arrowhead-red)"/>
  <line x1="410" y1="305" x2="440" y2="305" stroke="#d32f2f" stroke-width="3" marker-end="url(#arrowhead-red)"/>

  <!-- Évolution réglementaire (flèche verte) -->
  <line x1="335" y1="265" x2="335" y2="200" stroke="#388e3c" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrowhead-green)"/>
  <text x="350" y="195" class="legend-text" fill="#388e3c">Mises à jour réglementaires</text>

  <!-- LÉGENDE -->
  <rect x="680" y="100" width="280" height="400" fill="#fafafa" stroke="#666" stroke-width="1" rx="5"/>
  <text x="820" y="125" class="legend-title" fill="#333">LÉGENDE</text>

  <!-- Flux principaux -->
  <line x1="700" y1="150" x2="740" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="750" y="155" class="legend-text" fill="#333">Flux de données principaux</text>

  <!-- Interfaces modulaires -->
  <line x1="700" y1="175" x2="740" y2="175" stroke="#d32f2f" stroke-width="3" marker-end="url(#arrowhead-red)"/>
  <text x="750" y="180" class="legend-text" fill="#333">Interfaces modulaires</text>

  <!-- Points d'évolution -->
  <line x1="700" y1="200" x2="740" y2="200" stroke="#388e3c" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrowhead-green)"/>
  <text x="750" y="205" class="legend-text" fill="#333">Points d'évolution réglementaire</text>

  <!-- Composants types -->
  <rect x="700" y="225" width="30" height="15" fill="#bbdefb" stroke="#1565c0"/>
  <text x="740" y="237" class="legend-text" fill="#333">Interface Utilisateur</text>

  <rect x="700" y="250" width="30" height="15" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="740" y="262" class="legend-text" fill="#333">Logique Métier standard</text>

  <rect x="700" y="275" width="30" height="15" fill="#ffcdd2" stroke="#d32f2f"/>
  <text x="740" y="287" class="legend-text" fill="#333">Composant protégé/isolé</text>

  <rect x="700" y="300" width="30" height="15" fill="#ffe0b2" stroke="#ef6c00"/>
  <text x="740" y="312" class="legend-text" fill="#333">Couche Données</text>

  <!-- Avantages -->
  <text x="700" y="345" class="legend-title" fill="#333">AVANTAGES :</text>
  <text x="700" y="365" class="legend-text" fill="#333">✓ Séparation claire des responsabilités</text>
  <text x="700" y="380" class="legend-text" fill="#333">✓ Maintenabilité améliorée</text>
  <text x="700" y="395" class="legend-text" fill="#333">✓ Tests unitaires facilités</text>
  <text x="700" y="410" class="legend-text" fill="#333">✓ Évolution réglementaire isolée</text>
  <text x="700" y="425" class="legend-text" fill="#333">✓ Réutilisabilité des composants</text>
  <text x="700" y="440" class="legend-text" fill="#333">✓ Scalabilité horizontale</text>

  <!-- Notes importantes -->
  <text x="700" y="470" class="legend-title" fill="#d32f2f">⚠️ POINTS CLÉS :</text>
  <text x="700" y="485" class="legend-text" fill="#333">• tax_engine isolé pour mises à jour</text>
  <text x="700" y="495" class="legend-text" fill="#333">  réglementaires indépendantes</text>

</svg>