<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Styles -->
  <defs>
    <style>
      .title-text { font-family: "Arial", sans-serif; font-size: 16px; font-weight: bold; fill: #2c3e50; }
      .subtitle-text { font-family: "Arial", sans-serif; font-size: 14px; font-weight: bold; fill: #2c3e50; }
      .label-text { font-family: "Arial", sans-serif; font-size: 11px; fill: #2c3e50; }
      .small-text { font-family: "Arial", sans-serif; font-size: 9px; fill: #34495e; }
      .production { fill: #f39c12; stroke: #e67e22; stroke-width: 2; }
      .consommateur1 { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .consommateur2 { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .consommateur3 { fill: #27ae60; stroke: #229954; stroke-width: 2; }
      .flux-thin { stroke-width: 2; fill: none; }
      .flux-medium { stroke-width: 4; fill: none; }
      .flux-thick { stroke-width: 6; fill: none; }
      .cle-defaut { fill: #ecf0f1; stroke: #95a5a6; stroke-width: 2; }
      .cle-dynamique { fill: #f8f9ff; stroke: #9b59b6; stroke-width: 2; }
      .cle-statique { fill: #f0fff4; stroke: #1abc9c; stroke-width: 2; }
    </style>
    
    <!-- Flèches -->
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12" />
    </marker>
  </defs>

  <!-- Titre principal -->
  <text x="500" y="25" text-anchor="middle" class="title-text">
    Comparaison des 3 types de clés de répartition
  </text>

  <!-- Production commune -->
  <rect x="430" y="35" width="140" height="40" rx="5" class="production"/>
  <text x="500" y="55" text-anchor="middle" class="label-text" fill="white">Production PV</text>
  <text x="500" y="67" text-anchor="middle" class="small-text" fill="white">100 kWh à répartir</text>

  <!-- Flèches de distribution -->
  <line x1="450" y1="80" x2="190" y2="105" stroke="#f39c12" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <line x1="500" y1="80" x2="500" y2="105" stroke="#f39c12" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <line x1="550" y1="80" x2="810" y2="105" stroke="#f39c12" stroke-width="3" marker-end="url(#arrowOrange)"/>

  <!-- SCÉNARIO 1: CLÉ PAR DÉFAUT (80%) -->
  <rect x="50" y="110" width="280" height="180" rx="5" class="cle-defaut"/>
  <text x="190" y="130" text-anchor="middle" class="subtitle-text">1. Clé par défaut (80%)</text>
  <text x="190" y="145" text-anchor="middle" class="small-text">Répartition au prorata des besoins</text>
  
  <!-- Consommateurs avec besoins -->
  <rect x="70" y="160" width="60" height="40" rx="3" class="consommateur1"/>
  <text x="100" y="172" text-anchor="middle" class="small-text" fill="white">Logement</text>
  <text x="100" y="182" text-anchor="middle" class="small-text" fill="white">social</text>
  <text x="100" y="192" text-anchor="middle" class="small-text" fill="white">40 kWh</text>
  
  <rect x="150" y="160" width="60" height="40" rx="3" class="consommateur2"/>
  <text x="180" y="172" text-anchor="middle" class="small-text" fill="white">PME</text>
  <text x="180" y="182" text-anchor="middle" class="small-text" fill="white">locale</text>
  <text x="180" y="192" text-anchor="middle" class="small-text" fill="white">30 kWh</text>
  
  <rect x="230" y="160" width="60" height="40" rx="3" class="consommateur3"/>
  <text x="260" y="172" text-anchor="middle" class="small-text" fill="white">Résidence</text>
  <text x="260" y="182" text-anchor="middle" class="small-text" fill="white">secondaire</text>
  <text x="260" y="192" text-anchor="middle" class="small-text" fill="white">30 kWh</text>
  
  <!-- Mécanisme de répartition -->
  <text x="190" y="220" text-anchor="middle" class="small-text" style="font-weight: bold;">Mécanisme: 40+30+30 = 100 kWh</text>
  <text x="190" y="235" text-anchor="middle" class="small-text">Répartition proportionnelle:</text>
  <text x="100" y="250" text-anchor="middle" class="small-text">40 kWh (40%)</text>
  <text x="180" y="250" text-anchor="middle" class="small-text">30 kWh (30%)</text>
  <text x="260" y="250" text-anchor="middle" class="small-text">30 kWh (30%)</text>
  
  <text x="190" y="270" text-anchor="middle" class="small-text" style="font-weight: bold;">✓ Simple ✗ Pas d'optimisation sociale</text>

  <!-- SCÉNARIO 2: CLÉ DYNAMIQUE (15%) -->
  <rect x="360" y="110" width="280" height="180" rx="5" class="cle-dynamique"/>
  <text x="500" y="130" text-anchor="middle" class="subtitle-text">2. Clé dynamique (15%)</text>
  <text x="500" y="145" text-anchor="middle" class="small-text">Priorisation selon critères sociaux</text>
  
  <!-- Consommateurs avec critères -->
  <rect x="380" y="160" width="60" height="40" rx="3" class="consommateur1"/>
  <text x="410" y="172" text-anchor="middle" class="small-text" fill="white">Logement</text>
  <text x="410" y="182" text-anchor="middle" class="small-text" fill="white">social</text>
  <text x="410" y="192" text-anchor="middle" class="small-text" fill="white">Priorité ⭐</text>
  
  <rect x="460" y="160" width="60" height="40" rx="3" class="consommateur2"/>
  <text x="490" y="172" text-anchor="middle" class="small-text" fill="white">PME</text>
  <text x="490" y="182" text-anchor="middle" class="small-text" fill="white">locale</text>
  <text x="490" y="192" text-anchor="middle" class="small-text" fill="white">Standard</text>
  
  <rect x="540" y="160" width="60" height="40" rx="3" class="consommateur3"/>
  <text x="570" y="172" text-anchor="middle" class="small-text" fill="white">Résidence</text>
  <text x="570" y="182" text-anchor="middle" class="small-text" fill="white">secondaire</text>
  <text x="570" y="192" text-anchor="middle" class="small-text" fill="white">Faible</text>
  
  <!-- Mécanisme optimisé -->
  <text x="500" y="220" text-anchor="middle" class="small-text" style="font-weight: bold;">Mécanisme: Priorisation sociale</text>
  <text x="500" y="235" text-anchor="middle" class="small-text">Répartition optimisée:</text>
  <text x="410" y="250" text-anchor="middle" class="small-text">45 kWh (45%)</text>
  <text x="490" y="250" text-anchor="middle" class="small-text">35 kWh (35%)</text>
  <text x="570" y="250" text-anchor="middle" class="small-text">20 kWh (20%)</text>
  
  <text x="500" y="270" text-anchor="middle" class="small-text" style="font-weight: bold;">✓ Optimisation sociale ✗ Gestion complexe</text>

  <!-- SCÉNARIO 3: CLÉ STATIQUE (5%) -->
  <rect x="670" y="110" width="280" height="180" rx="5" class="cle-statique"/>
  <text x="810" y="130" text-anchor="middle" class="subtitle-text">3. Clé statique (5%)</text>
  <text x="810" y="145" text-anchor="middle" class="small-text">Parts contractuelles fixes</text>
  
  <!-- Consommateurs avec parts fixes -->
  <rect x="690" y="160" width="60" height="40" rx="3" class="consommateur1"/>
  <text x="720" y="172" text-anchor="middle" class="small-text" fill="white">Logement</text>
  <text x="720" y="182" text-anchor="middle" class="small-text" fill="white">social</text>
  <text x="720" y="192" text-anchor="middle" class="small-text" fill="white">Part: 50%</text>
  
  <rect x="770" y="160" width="60" height="40" rx="3" class="consommateur2"/>
  <text x="800" y="172" text-anchor="middle" class="small-text" fill="white">PME</text>
  <text x="800" y="182" text-anchor="middle" class="small-text" fill="white">locale</text>
  <text x="800" y="192" text-anchor="middle" class="small-text" fill="white">Part: 30%</text>
  
  <rect x="850" y="160" width="60" height="40" rx="3" class="consommateur3"/>
  <text x="880" y="172" text-anchor="middle" class="small-text" fill="white">Résidence</text>
  <text x="880" y="182" text-anchor="middle" class="small-text" fill="white">secondaire</text>
  <text x="880" y="192" text-anchor="middle" class="small-text" fill="white">Part: 20%</text>
  
  <!-- Mécanisme contractuel -->
  <text x="810" y="220" text-anchor="middle" class="small-text" style="font-weight: bold;">Mécanisme: Contrat signé au démarrage</text>
  <text x="810" y="235" text-anchor="middle" class="small-text">Répartition contractuelle:</text>
  <text x="720" y="250" text-anchor="middle" class="small-text">50 kWh (50%)</text>
  <text x="800" y="250" text-anchor="middle" class="small-text">30 kWh (30%)</text>
  <text x="880" y="250" text-anchor="middle" class="small-text">20 kWh (20%)</text>
  
  <text x="810" y="270" text-anchor="middle" class="small-text" style="font-weight: bold;">✓ Prévisibilité totale ✗ Aucune flexibilité</text>

  <!-- Comparaison et enjeux -->
  <rect x="200" y="300" width="600" height="120" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="500" y="325" text-anchor="middle" class="subtitle-text">Enjeu d'optimisation OptimPV</text>
  
  <text x="300" y="345" class="small-text">• 80% utilisent la clé par défaut (sous-optimale)</text>
  <text x="300" y="360" class="small-text">• 15% utilisent des clés dynamiques (complexes à gérer)</text>
  <text x="300" y="375" class="small-text">• 5% utilisent des clés statiques (rigides mais prévisibles)</text>
  
  <text x="500" y="400" text-anchor="middle" class="small-text" style="font-weight: bold;">
    → Opportunité : algorithme OptimPV pour optimiser automatiquement la clé selon le contexte
  </text>


  <!-- Légende des consommateurs -->
  <text x="200" y="450" text-anchor="middle" class="small-text">Consommateurs :</text>
  <rect x="300" y="445" width="15" height="10" class="consommateur1"/>
  <text x="320" y="453" class="small-text">Logement social</text>
  
  <rect x="450" y="445" width="15" height="10" class="consommateur2"/>
  <text x="470" y="453" class="small-text">PME locale</text>
  
  <rect x="580" y="445" width="15" height="10" class="consommateur3"/>
  <text x="600" y="453" class="small-text">Résidence secondaire</text>

</svg>