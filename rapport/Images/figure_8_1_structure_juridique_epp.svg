<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="850" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .entity-text { font-family: Arial, sans-serif; font-size: 14px; fill: #2c3e50; font-weight: bold; }
      .detail-text { font-family: Arial, sans-serif; font-size: 12px; fill: #34495e; }
      .small-text { font-family: Arial, sans-serif; font-size: 11px; fill: #34495e; }
      .pmo-box { fill: #e8f5e8; stroke: #27ae60; stroke-width: 3; rx: 12; }
      .spv-box { fill: #fff3cd; stroke: #f39c12; stroke-width: 3; rx: 12; }
      .epp-box { fill: #e1f5fe; stroke: #3498db; stroke-width: 3; rx: 12; }
      .consumer-box { fill: #fce4ec; stroke: #e91e63; stroke-width: 3; rx: 12; }
      .bail-box { fill: #f3e5f5; stroke: #9b59b6; stroke-width: 3; rx: 12; }
      .bail-option { fill: #ffffff; stroke: #9b59b6; stroke-width: 2; rx: 8; }
      .arrow { stroke: #2c3e50; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .dashed-arrow { stroke: #7f8c8d; stroke-width: 2; fill: none; stroke-dasharray: 8,4; marker-end: url(#arrowhead-gray); }
      .flow-text { font-family: Arial, sans-serif; font-size: 11px; fill: #2c3e50; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#2c3e50"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#7f8c8d"/>
    </marker>
  </defs>

  <!-- Titre -->
  <text x="600" y="40" text-anchor="middle" class="title">Structure juridique EaaS - EPP Antibes</text>

  <!-- Niveau 1 : PMO Association -->
  <rect x="450" y="80" width="300" height="100" class="pmo-box"/>
  <text x="600" y="110" text-anchor="middle" class="entity-text">PMO Association</text>
  <text x="600" y="135" text-anchor="middle" class="detail-text">Propriétaire installation PV</text>
  <text x="600" y="155" text-anchor="middle" class="detail-text">Organise et facture ACC</text>

  <!-- Niveau 2 : SPV Producteur -->
  <rect x="450" y="250" width="300" height="100" class="spv-box"/>
  <text x="600" y="280" text-anchor="middle" class="entity-text">SPV Producteur (SAS)</text>
  <text x="600" y="305" text-anchor="middle" class="detail-text">Finance l'installation</text>
  <text x="600" y="325" text-anchor="middle" class="detail-text">Exploite pour l'Association</text>

  <!-- Niveau 3 : EPP et Consommateurs externes -->
  <!-- EPP -->
  <rect x="150" y="420" width="300" height="100" class="epp-box"/>
  <text x="300" y="450" text-anchor="middle" class="entity-text">EPP Antibes</text>
  <text x="300" y="475" text-anchor="middle" class="detail-text">Propriétaire toiture</text>
  <text x="300" y="495" text-anchor="middle" class="detail-text">Client final ACC</text>

  <!-- Consommateurs externes -->
  <rect x="750" y="420" width="300" height="100" class="consumer-box"/>
  <text x="900" y="450" text-anchor="middle" class="entity-text">Consommateurs externes</text>
  <text x="900" y="475" text-anchor="middle" class="detail-text">Clients finaux ACC</text>
  <text x="900" y="495" text-anchor="middle" class="detail-text">Réseau BT local</text>

  <!-- Enedis -->
  <rect x="500" y="420" width="200" height="100" style="fill: #fff5ee; stroke: #ff7f0e; stroke-width: 3; rx: 12;"/>
  <text x="600" y="450" text-anchor="middle" class="entity-text">Enedis</text>
  <text x="600" y="475" text-anchor="middle" class="detail-text">Gestionnaire réseau</text>
  <text x="600" y="495" text-anchor="middle" class="detail-text">Convention ACC</text>

  <!-- Options de bail -->
  <rect x="50" y="580" width="350" height="200" class="bail-box"/>
  <text x="225" y="615" text-anchor="middle" class="entity-text">Options contractuelles SPV-EPP</text>
  
  <rect x="80" y="640" width="290" height="40" class="bail-option" fill="#d5e8d4"/>
  <text x="225" y="665" text-anchor="middle" class="detail-text">Bail emphytéotique (CHOISI)</text>
  
  <rect x="80" y="690" width="290" height="40" class="bail-option"/>
  <text x="225" y="715" text-anchor="middle" class="detail-text">Bail civil</text>
  
  <rect x="80" y="740" width="290" height="40" class="bail-option"/>
  <text x="225" y="765" text-anchor="middle" class="detail-text">Bail commercial</text>

  <!-- Flux principal -->
  <!-- PMO vers SPV (contrat financement/exploitation) -->
  <line x1="600" y1="180" x2="600" y2="250" class="arrow"/>
  <text x="640" y="220" class="flow-text">Contrat EaaS</text>

  <!-- PMO vers EPP (facturation) -->
  <line x1="500" y1="180" x2="350" y2="420" class="arrow"/>
  <text x="350" y="300" class="flow-text">Facturation ACC</text>

  <!-- PMO vers Consommateurs (facturation) -->
  <line x1="700" y1="180" x2="850" y2="420" class="arrow"/>
  <text x="800" y="300" class="flow-text">Facturation ACC</text>

  <!-- Chaque participant vers Enedis (conventions individuelles) -->
  <!-- EPP vers Enedis -->
  <line x1="450" y1="470" x2="500" y2="470" class="dashed-arrow"/>
  <text x="460" y="460" class="flow-text">Convention</text>
  
  <!-- Consommateurs vers Enedis -->
  <line x1="750" y1="470" x2="700" y2="470" class="dashed-arrow"/>
  <text x="720" y="460" class="flow-text">Convention</text>
  
  <!-- SPV vers Enedis -->
  <line x1="600" y1="350" x2="600" y2="420" class="dashed-arrow"/>
  <text x="620" y="385" class="flow-text">Convention</text>

  <!-- Relation bail SPV-EPP (pointillé) -->
  <line x1="500" y1="350" x2="400" y2="420" class="dashed-arrow"/>
  <text x="430" y="385" class="flow-text">Bail toiture</text>

  <!-- Lien options bail -->
  <line x1="225" y1="580" x2="300" y2="520" class="dashed-arrow"/>

  <!-- Légende -->
  <text x="600" y="820" text-anchor="middle" class="small-text">PMO : Personne Morale Organisatrice | SPV : Special Purpose Vehicle | ACC : Autoconsommation Collective</text>
</svg>