<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Définitions des styles (même thème que figure 3.2) -->
  <defs>
    <style>
      .title-text { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; fill: #1a1a1a; }
      .box-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; fill: #333; }
      .detail-text { font-family: Arial, sans-serif; font-size: 11px; text-anchor: middle; fill: #555; }
      .small-text { font-family: Arial, sans-serif; font-size: 10px; text-anchor: start; fill: #555; }
      .api-text { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .flow-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; text-anchor: middle; }
    </style>
    
    <!-- Flèches -->
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#333" />
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#388e3c" />
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#1976d2" />
    </marker>
  </defs>

  <!-- Fond blanc -->
  <rect width="100%" height="100%" fill="white"/>
  
  <!-- Titre principal -->
  <rect x="200" y="20" width="1000" height="45" fill="#f5f5f5" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="700" y="48" class="title-text">Architecture d'Intégration APIs - Workflow de Prospection ACC</text>

  <!-- COLONNE GAUCHE : SOURCES DE DONNÉES -->
  <text x="200" y="100" class="box-text" fill="#1976d2">SOURCES DE DONNÉES PUBLIQUES</text>
  
  <!-- API Cadastre IGN -->
  <g transform="translate(200, 140)">
    <rect x="-100" y="-25" width="200" height="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
    <text x="0" y="-8" class="api-text" fill="#1976d2">API Cadastre IGN</text>
    <text x="0" y="5" class="detail-text">Géométries parcellaires</text>
    <text x="0" y="18" class="detail-text">Polygones bâtiments</text>
  </g>

  <!-- API PVGIS -->
  <g transform="translate(200, 220)">
    <rect x="-100" y="-25" width="200" height="50" fill="#fff8e1" stroke="#f57c00" stroke-width="2" rx="5"/>
    <text x="0" y="-8" class="api-text" fill="#f57c00">API PVGIS EU</text>
    <text x="0" y="5" class="detail-text">Irradiation solaire</text>
    <text x="0" y="18" class="detail-text">20 ans historique</text>
  </g>

  <!-- BD TOPO IGN -->
  <g transform="translate(200, 300)">
    <rect x="-100" y="-25" width="200" height="50" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="5"/>
    <text x="0" y="-8" class="api-text" fill="#4caf50">BD TOPO IGN</text>
    <text x="0" y="5" class="detail-text">Hauteurs bâtiments</text>
    <text x="0" y="18" class="detail-text">Nature/Usage</text>
  </g>

  <!-- API DPE ADEME -->
  <g transform="translate(200, 380)">
    <rect x="-100" y="-25" width="200" height="50" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="5"/>
    <text x="0" y="-8" class="api-text" fill="#9c27b0">API DPE ADEME</text>
    <text x="0" y="5" class="detail-text">Classe énergétique</text>
    <text x="0" y="18" class="detail-text">Consommation kWh/m²</text>
  </g>

  <!-- Open Data Enedis -->
  <g transform="translate(200, 460)">
    <rect x="-100" y="-25" width="200" height="50" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
    <text x="0" y="-8" class="api-text" fill="#ff9800">Open Data Enedis</text>
    <text x="0" y="5" class="detail-text">Consommation IRIS</text>
    <text x="0" y="18" class="detail-text">Densité énergétique</text>
  </g>

  <!-- COLONNE CENTRALE : TRAITEMENT -->
  <text x="600" y="100" class="box-text" fill="#333">PIPELINE DE TRAITEMENT</text>

  <!-- 1. Collecte et Cache -->
  <g transform="translate(600, 160)">
    <rect x="-120" y="-30" width="240" height="60" fill="#f5f5f5" stroke="#666" stroke-width="2" rx="5"/>
    <text x="0" y="-10" class="box-text">1. COLLECTE &amp; CACHE</text>
    <text x="0" y="5" class="detail-text">Cache intelligent différencié</text>
    <text x="0" y="18" class="detail-text">PVGIS: 15min, DPE: 30 jours</text>
  </g>

  <!-- 2. Normalisation -->
  <g transform="translate(600, 260)">
    <rect x="-120" y="-30" width="240" height="60" fill="#f5f5f5" stroke="#666" stroke-width="2" rx="5"/>
    <text x="0" y="-10" class="box-text">2. NORMALISATION</text>
    <text x="0" y="5" class="detail-text">Projection Lambert-93</text>
    <text x="0" y="18" class="detail-text">Fusion par géolocalisation</text>
  </g>

  <!-- 3. Calculs -->
  <g transform="translate(600, 360)">
    <rect x="-120" y="-30" width="240" height="60" fill="#f5f5f5" stroke="#666" stroke-width="2" rx="5"/>
    <text x="0" y="-10" class="box-text">3. CALCULS TECHNIQUES</text>
    <text x="0" y="5" class="detail-text">Surface exploitable</text>
    <text x="0" y="18" class="detail-text">Orientation/Pente optimales</text>
  </g>

  <!-- 4. Scoring -->
  <g transform="translate(600, 460)">
    <rect x="-120" y="-30" width="240" height="60" fill="#f5f5f5" stroke="#666" stroke-width="2" rx="5"/>
    <text x="0" y="-10" class="box-text">4. SCORING MULTI-CRITÈRES</text>
    <text x="0" y="5" class="detail-text">Score technique (50-30-20)</text>
    <text x="0" y="18" class="detail-text">Score économique &amp; commercial</text>
  </g>

  <!-- 5. Agrégation -->
  <g transform="translate(600, 560)">
    <rect x="-120" y="-30" width="240" height="60" fill="#f5f5f5" stroke="#666" stroke-width="2" rx="5"/>
    <text x="0" y="-10" class="box-text">5. AGRÉGATION</text>
    <text x="0" y="5" class="detail-text">Score global pondéré</text>
    <text x="0" y="18" class="detail-text">Classification A-B-C-D-E</text>
  </g>

  <!-- COLONNE DROITE : SORTIES -->
  <text x="1000" y="100" class="box-text" fill="#388e3c">RÉSULTATS &amp; VISUALISATION</text>

  <!-- Carte interactive -->
  <g transform="translate(1000, 160)">
    <rect x="-120" y="-30" width="240" height="60" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="5"/>
    <text x="0" y="-10" class="box-text" fill="#388e3c">CARTE INTERACTIVE</text>
    <text x="0" y="5" class="detail-text">Heatmap potentiel</text>
    <text x="0" y="18" class="detail-text">Clusters ACC optimaux</text>
  </g>

  <!-- Tableau prospects -->
  <g transform="translate(1000, 260)">
    <rect x="-120" y="-30" width="240" height="60" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="5"/>
    <text x="0" y="-10" class="box-text" fill="#388e3c">TABLEAU PROSPECTS</text>
    <text x="0" y="5" class="detail-text">Ranking par score</text>
    <text x="0" y="18" class="detail-text">Filtres multi-critères</text>
  </g>

  <!-- Fiches détaillées -->
  <g transform="translate(1000, 360)">
    <rect x="-120" y="-30" width="240" height="60" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="5"/>
    <text x="0" y="-10" class="box-text" fill="#388e3c">FICHES DÉTAILLÉES</text>
    <text x="0" y="5" class="detail-text">Analyse par bâtiment</text>
    <text x="0" y="18" class="detail-text">Potentiel kWc estimé</text>
  </g>

  <!-- Export CRM -->
  <g transform="translate(1000, 460)">
    <rect x="-120" y="-30" width="240" height="60" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="5"/>
    <text x="0" y="-10" class="box-text" fill="#388e3c">EXPORT CRM</text>
    <text x="0" y="5" class="detail-text">Format CSV/JSON</text>
    <text x="0" y="18" class="detail-text">Intégration pipeline vente</text>
  </g>

  <!-- FLÈCHES DE CONNEXION -->
  
  <!-- APIs vers Collecte -->
  <line x1="300" y1="140" x2="480" y2="160" stroke="#1976d2" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="300" y1="220" x2="480" y2="160" stroke="#f57c00" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="300" x2="480" y2="160" stroke="#4caf50" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="380" x2="480" y2="160" stroke="#9c27b0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="460" x2="480" y2="160" stroke="#ff9800" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pipeline interne -->
  <line x1="600" y1="190" x2="600" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="290" x2="600" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="390" x2="600" y2="430" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="490" x2="600" y2="530" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Vers résultats -->
  <line x1="720" y1="560" x2="880" y2="160" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="720" y1="560" x2="880" y2="260" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="720" y1="560" x2="880" y2="360" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="720" y1="560" x2="880" y2="460" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- FORMULE DE SCORING (centré avec pipeline) -->
  <g transform="translate(600, 650)">
    <rect x="-150" y="-20" width="300" height="40" fill="#e1f5fe" stroke="#0277bd" stroke-width="2" rx="5"/>
    <text x="0" y="-3" class="box-text" fill="#0277bd">Score Global = 0,4×Tech + 0,35×Éco + 0,25×Com</text>
    <text x="0" y="12" class="detail-text">Classification : A (80-100) → E (0-19)</text>
  </g>

  <!-- PANNEAU INFÉRIEUR : MÉTRIQUES (centré avec pipeline) -->
  <g transform="translate(300, 720)">
    <rect x="0" y="0" width="600" height="120" fill="#fafafa" stroke="#666" stroke-width="1" rx="3"/>
    <text x="300" y="25" class="box-text">MÉTRIQUES DE PERFORMANCE</text>
    
    <text x="50" y="50" class="small-text" font-weight="bold">Temps de traitement :</text>
    <text x="60" y="68" class="small-text">• Analyse 1000 prospects : 5-8 min</text>
    <text x="60" y="83" class="small-text">• vs Excel manuel : 15-20 heures</text>
    <text x="60" y="98" class="small-text" fill="#388e3c">• Gain de temps : -97%</text>

    <text x="320" y="50" class="small-text" font-weight="bold">Volume de données :</text>
    <text x="330" y="68" class="small-text">• 5 APIs interrogées en parallèle</text>
    <text x="330" y="83" class="small-text">• Cache : 85% hits après warm-up</text>
    <text x="330" y="98" class="small-text">• Scoring : 3 dimensions × 3 critères</text>
  </g>

</svg>